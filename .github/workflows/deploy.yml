name: Deploy to GitHub Pages

on:
  push:
    branches:
      - main

permissions:
  contents: read
  pages: write
  id-token: write
  actions: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  checks:
    name: Checks
    uses: ./.github/workflows/checks.yml

  deploy:
    name: Deploy
    needs: [checks]
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v7

      - name: Install pnpm
        uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version: '22.x'
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build content
        run: pnpm run build:content

      - name: Build application
        run: pnpm exec ng build

      - name: Post-build processing
        run: pnpm exec tsx scripts/post-build.ts

      - uses: actions/configure-pages@v6

      # On a re-run, a `github-pages` artifact from a previous attempt can linger
      # in the same run. `actions/deploy-pages` then fails with
      # "Multiple artifacts named github-pages were unexpectedly found".
      # Remove any pre-existing `github-pages` artifact before uploading a fresh one.
      - name: Delete stale Pages artifacts
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh api "repos/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}/artifacts" \
            --jq '.artifacts[] | select(.name=="github-pages") | .id' \
          | while read -r id; do
              echo "Deleting stale github-pages artifact $id"
              gh api -X DELETE "repos/${GITHUB_REPOSITORY}/actions/artifacts/$id"
            done

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: dist/k9n-dev/browser

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
